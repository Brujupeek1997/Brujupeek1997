name: Update profile visuals

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/generate_profile_assets.py
      - .github/workflows/update-profile-assets.yml

permissions:
  contents: write

concurrency:
  group: update-profile-assets
  cancel-in-progress: true

jobs:
  update-profile-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_profile_assets.py

      - name: Commit changed cards
        shell: bash
        run: |
          if git diff --quiet -- assets; then
            echo "Profile visuals are unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh profile visuals"
          git push
